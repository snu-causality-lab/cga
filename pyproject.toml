[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-graph-algorithms"
version = "0.2.0a1"
description = "Causal graph algorithms for separation, adjustment, equivalence and identification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.11"
dependencies = ["lark>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/snu-causality-lab/cga"
"Lean proof map" = "https://github.com/snu-causality-lab/open-causal-science/blob/main/docs/cga.md"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
causal_graph_algorithms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python/src"]
