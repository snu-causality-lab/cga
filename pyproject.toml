[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-graph-algorithms"
version = "0.1.0a1"
description = "Causal graph views, separation, adjustment and Markov equivalence"
readme = "README.md"

requires-python = ">=3.11"
dependencies = ["lark>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
causal_graph_algorithms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python/src"]
